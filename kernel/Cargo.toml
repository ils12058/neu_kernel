[package]
name = "neu-kernel"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "neu-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
test-panic = []
test-missing-memory-map = []
test-memory = []
test-invalid-opcode = []
test-general-protection = []
test-page-fault = []
test-double-fault = []
test-breakpoint = []
test-paging = []
test-paging-bootstrap-failure = []
test-unmapped = []
test-readonly = []
test-nx = []
test-guard-low = []
test-guard-high = []
test-df-guard-low = []
test-df-guard-high = []
# Internal support is reachable only through exactly one isolated test image.
user-test = []
test-user = ["user-test"]
test-user-kernel = ["user-test"]
test-user-readonly = ["user-test"]
test-user-nx = ["user-test"]
test-user-unmapped = ["user-test"]
test-user-privileged = ["user-test"]
test-user-gate = ["user-test"]
test-user-guard = ["user-test"]

native-test = ["user-test"]
test-native = ["native-test"]
test-native-unknown = ["native-test"]
test-native-exit-invalid = ["native-test"]
test-native-return-rip = ["native-test"]
test-native-return-rsp = ["native-test"]
test-native-return-flags = ["native-test"]
test-native-return-selectors = ["native-test"]
test-native-disabled = ["native-test"]

node-test = ["native-test"]
test-nodes = ["node-test"]
test-nodes-a-fault = ["node-test"]
test-nodes-b-fault = ["node-test"]
test-nodes-cross = ["node-test"]
test-nodes-reclaim = ["node-test"]
test-nodes-rollback = ["node-test"]
