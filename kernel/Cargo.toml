[package]
name = "neu-kernel"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "neu-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
test-panic = []
test-missing-memory-map = []
test-memory = []
test-invalid-opcode = []
test-general-protection = []
test-page-fault = []
test-double-fault = []
test-breakpoint = []
test-paging = []
test-paging-bootstrap-failure = []
test-unmapped = []
test-readonly = []
test-nx = []
test-guard-low = []
test-guard-high = []
test-df-guard-low = []
test-df-guard-high = []
# Internal support is reachable only through exactly one isolated test image.
user-test = []
test-user = ["user-test"]
test-user-kernel = ["user-test"]
test-user-readonly = ["user-test"]
test-user-nx = ["user-test"]
test-user-unmapped = ["user-test"]
test-user-privileged = ["user-test"]
test-user-gate = ["user-test"]
test-user-guard = ["user-test"]

native-test = ["user-test"]
test-native = ["native-test"]
test-native-unknown = ["native-test"]
test-native-exit-invalid = ["native-test"]
test-native-return-rip = ["native-test"]
test-native-return-rsp = ["native-test"]
test-native-return-flags = ["native-test"]
test-native-return-selectors = ["native-test"]
test-native-disabled = ["native-test"]

node-test = ["native-test"]
test-nodes = ["node-test"]
test-nodes-a-fault = ["node-test"]
test-nodes-b-fault = ["node-test"]
test-nodes-cross = ["node-test"]
test-nodes-reclaim = ["node-test"]
test-nodes-rollback = ["node-test"]

timer-test = []
test-timer = ["timer-test"]
test-timer-xapic = ["timer-test"]
test-timer-repeat = ["timer-test"]
test-timer-spurious = ["timer-test"]
test-timer-unsupported = ["timer-test"]
test-timer-unexpected = ["timer-test"]
test-timer-software = ["timer-test"]

switch-test = ["node-test"]
test-switch = ["switch-test"]
test-switch-a-fault = ["switch-test"]
test-switch-b-fault = ["switch-test"]
test-switch-cross = ["switch-test"]
test-switch-stack-user = ["switch-test"]
test-switch-stack-guard = ["switch-test"]
test-switch-invalid-context = ["switch-test"]
test-switch-rollback = ["switch-test"]
test-switch-stale = ["switch-test"]

preempt-test = ["switch-test"]
test-preempt = ["preempt-test"]
test-preempt-xapic = ["preempt-test"]
test-preempt-a-fault = ["preempt-test"]
test-preempt-b-fault = ["preempt-test"]
test-preempt-cross = ["preempt-test"]
test-preempt-native = ["preempt-test"]
test-preempt-invalid-context = ["preempt-test"]
test-preempt-stack-mismatch = ["preempt-test"]
test-preempt-handoff = ["preempt-test"]
test-preempt-stale = ["preempt-test"]
test-preempt-unsafe = ["preempt-test"]
test-preempt-unexpected = ["preempt-test"]
test-preempt-software = ["preempt-test"]
test-preempt-origin = ["preempt-test"]
test-preempt-fpu = ["preempt-test"]

multi-test = ["preempt-test"]
test-threads = ["multi-test"]
test-threads-xapic = ["multi-test"]
test-threads-a1-fault = ["multi-test"]
test-threads-a2-fault = ["multi-test"]
test-threads-b-fault = ["multi-test"]
test-threads-cross = ["multi-test"]
test-threads-a-cross = ["multi-test"]
test-threads-rollback = ["multi-test"]
test-threads-stale = ["multi-test"]
test-threads-stack = ["multi-test"]
test-threads-user-guard = ["multi-test"]
test-threads-return-stack = ["multi-test"]

cap-test = ["multi-test"]
test-capabilities = ["cap-test"]
test-capabilities-xapic = ["cap-test"]
test-capabilities-a-fault = ["cap-test"]
test-capabilities-a2-fault = ["cap-test"]
test-capabilities-b-fault = ["cap-test"]
test-capabilities-rollback = ["cap-test"]

test-native-cap-disabled = ["native-test"]

# Explicit experimental capability ABI image; private Phase 5A operations absent.
abi-02 = ["multi-test"]
test-address-space = ["abi-02"]
test-address-space-xapic = ["abi-02"]
test-address-space-a-fault = ["abi-02"]
test-address-space-a2-fault = ["abi-02"]
test-address-space-b-fault = ["abi-02"]
test-address-space-rollback = ["abi-02"]
test-native-abi02-disabled = ["native-test"]

# ABI 0.3 bridge to K6: bounded scalar IPC, no capability transport.
channel-test = ["abi-02"]
test-channels = ["channel-test"]
test-channels-legacy = ["channel-test"]
test-channels-stress = ["channel-test"]
test-channels-xapic = ["channel-test"]
test-channels-a-fault = ["channel-test"]
test-channels-b-fault = ["channel-test"]
test-channels-rollback = ["channel-test"]
test-native-abi03-disabled = ["native-test"]
test-native-abi04-disabled = ["native-test"]
test-address-space-channel-disabled = ["abi-02"]

# ABI 0.4 blocking Channel extension. Requires the 0.3 IPC image and controller.
channel-wait-test = ["channel-test"]
test-channels-wait = ["channel-wait-test"]
test-channels-wait-send = ["channel-wait-test"]
test-channels-wait-fifo = ["channel-wait-test"]
test-channels-wait-close-receive = ["channel-wait-test"]
test-channels-wait-close-send = ["channel-wait-test"]
test-channels-wait-fault = ["channel-wait-test"]
test-channels-wait-deadlock = ["channel-wait-test"]
test-channels-wait-xapic = ["channel-wait-test"]

cap-move-test = ["channel-wait-test"]
test-cap-moves = ["cap-move-test"]
test-cap-moves-xapic = ["cap-move-test"]
test-cap-moves-discard = ["cap-move-test"]
test-cap-moves-sender-fault = ["cap-move-test"]
test-cap-moves-sender-fault-before = ["cap-move-test"]
test-cap-moves-receiver-fault-after = ["cap-move-test"]
test-cap-moves-double = ["cap-move-test"]
test-cap-moves-backpressure-wait = ["cap-move-test"]
test-cap-moves-terminal-order = ["cap-move-test"]
test-cap-moves-sender-fault-xapic = ["test-cap-moves-sender-fault"]
test-cap-moves-receiver-fault-after-xapic = ["test-cap-moves-receiver-fault-after"]
test-cap-moves-backpressure-wait-xapic = ["test-cap-moves-backpressure-wait"]
test-native-move-send-disabled = ["native-test"]
test-native-move-receive-disabled = ["native-test"]
test-address-space-move-disabled = ["abi-02"]
test-channels-move-disabled = ["channel-test"]
test-channels-wait-move-disabled = ["channel-wait-test"]

# Trusted kernel-only MemoryObject lifetime probes; no public ABI.
memory-object-test = ["user-test"]
test-memory-object-lifetime = ["memory-object-test"]
test-memory-object-lifetime-reverse = ["memory-object-test"]
test-memory-object-new-tables = ["memory-object-test"]
test-memory-object-map-rollback = ["memory-object-test"]
test-memory-object-new-tables-reverse = ["memory-object-test"]
test-memory-object-fail-stop = ["memory-object-test"]
